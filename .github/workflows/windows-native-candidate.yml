name: Windows x64 native candidate

on:
  workflow_dispatch:
    inputs:
      contracts:
        description: cirnet-contracts-next commit SHA
        required: true
        type: string
      simulator:
        description: cirnet-simulator-next commit SHA
        required: true
        type: string
      hardware:
        description: cirnet-hardware-next commit SHA
        required: true
        type: string
      interface:
        description: cirnet-interface-next commit SHA
        required: true
        type: string
      embedded:
        description: cirnet-embedded-hardware commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate exact source revisions
        env:
          DEPENDENCIES_TOKEN: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          CONTRACTS_REVISION: ${{ inputs.contracts }}
          SIMULATOR_REVISION: ${{ inputs.simulator }}
          HARDWARE_REVISION: ${{ inputs.hardware }}
          INTERFACE_REVISION: ${{ inputs.interface }}
          EMBEDDED_REVISION: ${{ inputs.embedded }}
        run: |
          if (!$env:DEPENDENCIES_TOKEN) { throw 'Configure CIRNET_DEPENDENCIES_READ_TOKEN (Contents read access to the selected private repositories).' }
          foreach ($revision in @($env:CONTRACTS_REVISION, $env:SIMULATOR_REVISION,
              $env:HARDWARE_REVISION, $env:INTERFACE_REVISION, $env:EMBEDDED_REVISION)) {
              if ($revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Select a full lowercase commit SHA.' }
          }
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: source/cirnet-remote-next
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-contracts-next
          ref: ${{ inputs.contracts }}
          path: source/cirnet-contracts-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-simulator-next
          ref: ${{ inputs.simulator }}
          path: source/cirnet-simulator-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-hardware-next
          ref: ${{ inputs.hardware }}
          path: source/cirnet-hardware-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-interface-next
          ref: ${{ inputs.interface }}
          path: source/cirnet-interface-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cirnetlab/cirnet-embedded-hardware
          ref: ${{ inputs.embedded }}
          path: source/cirnet-embedded-hardware
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || secrets.CIRNET_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Assemble and verify the candidate
        working-directory: source/cirnet-remote-next
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 x64 build tools are required.' }
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $output = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'cirnet-next')).FullName
          $selection = Join-Path $output 'selection.json'
          node scripts/native-source-selection.mjs lock $selection
          ./scripts/build-native-windows.ps1 -Selection $selection -OutputParent $output
          $session = (Get-ChildItem -LiteralPath $output -Directory -Filter 'cirnet-*').FullName
          $receipt = Join-Path $session 'assembly-result.json'
          $result = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          $interface = Join-Path $session 'src/cirnet-interface-next'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $session 'chromium'
          node (Join-Path $interface 'node_modules/@playwright/test/cli.js') install chromium
          $smoke = node scripts/test-native-windows.mjs $result.directory $result.manifestSha256 $env:PLAYWRIGHT_BROWSERS_PATH | ConvertFrom-Json
          "CIRNET_CANDIDATE_ARCHIVE=$($result.bundle)" >> $env:GITHUB_ENV
          "CIRNET_CANDIDATE_RECEIPT=$receipt" >> $env:GITHUB_ENV
          "CIRNET_CANDIDATE_VERIFICATION=$(Join-Path $smoke.evidence 'result.json')" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-development-candidate
          path: |
            ${{ env.CIRNET_CANDIDATE_ARCHIVE }}
            ${{ env.CIRNET_CANDIDATE_RECEIPT }}
            ${{ env.CIRNET_CANDIDATE_VERIFICATION }}
          if-no-files-found: error
