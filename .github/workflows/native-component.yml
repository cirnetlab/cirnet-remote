name: Remote Windows x64 component

on:
  workflow_dispatch:
    inputs:
      contracts_revision:
        description: Exact Contracts Next commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: cirnet-remote-next
    env:
      CONTRACTS_REVISION: ${{ inputs.contracts_revision }}
    steps:
      - name: Validate dependency revisions
        working-directory: .
        run: |
          if ($env:CONTRACTS_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'Expected an exact Contracts Next commit.' }
      - uses: actions/checkout@v4
        with:
          path: cirnet-remote-next
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cirnetlab/cirnet-contracts-next
          ref: ${{ inputs.contracts_revision }}
          path: cirnet-contracts-next
          token: ${{ secrets.CIRNET_DEPENDENCIES_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Allocate an external verification session
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $contracts = Join-Path $workspace 'cirnet-contracts-next'
          $revision = git -C $contracts rev-parse HEAD
          if ($LASTEXITCODE -or $revision -cne $env:CONTRACTS_REVISION) { throw 'Contracts checkout differs from its pin.' }
          $env:CIRNET_ARTIFACTS_CONTEXT = @{
            owner = 'cirnet-remote-next-ci'
            roots = @((Get-Location).Path, $contracts)
          } | ConvertTo-Json -Compress
          $allocator = Join-Path $contracts 'tools/artifact-paths/cirnet_artifact_paths/artifact-paths.mjs'
          $session = node $allocator --directory (Join-Path $env:RUNNER_TEMP 'cirnet-native')
          if ($LASTEXITCODE -or !$session) { throw 'Artifact session allocation failed.' }
          "CIRNET_ARTIFACTS_SESSION=$session" >> $env:GITHUB_ENV
          "CIRNET_CONTRACTS_ROOT=$contracts" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $session 'target')" >> $env:GITHUB_ENV
      - name: Verify and build the Windows x64 component
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $target = 'x86_64-pc-windows-msvc'
          cargo fmt --all --check
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static"
          cargo test --locked --release --target $target
          cargo build --locked --release --target $target --bin cirnet-remote
          $binary = Join-Path $env:CARGO_TARGET_DIR "$target/release/cirnet-remote.exe"
          & $binary --version
          "$((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant())  cirnet-remote.exe" >> $env:GITHUB_STEP_SUMMARY
      - name: Verify native routes and migrations
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CIRNET_REMOTE_CLI_DIR = Join-Path $env:CIRNET_ARTIFACTS_SESSION 'cli'
          New-Item -ItemType Directory -Path $env:CIRNET_REMOTE_CLI_DIR | Out-Null
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static"
          cargo test --locked --release --target x86_64-pc-windows-msvc --test cli -- --ignored
